controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

    fer_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    franka_robot_state_broadcaster:
      type: franka_robot_state_broadcaster/FrankaRobotStateBroadcaster

franka_robot_state_broadcaster:
  ros__parameters:
    arm_id: fer

fer_arm_controller:
  ros__parameters:
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity
    joints:
      - fer_joint1
      - fer_joint2
      - fer_joint3
      - fer_joint4
      - fer_joint5
      - fer_joint6
      - fer_joint7
    gains:
      fer_joint1: { p: 2000., d: 60., i: 0., i_clamp: 1.,ff_velocity_scale: 1.0 }
      fer_joint2: { p: 2000., d: 60., i: 0., i_clamp: 1.,ff_velocity_scale: 1.0  }
      fer_joint3: { p: 2000., d: 60., i: 0., i_clamp: 1.,ff_velocity_scale: 1.0  }
      fer_joint4: { p: 2000., d: 60., i: 0., i_clamp: 1.,ff_velocity_scale: 1.0  }
      fer_joint5: { p: 1000., d: 20., i: 0., i_clamp: 1.,ff_velocity_scale: 1.0  }
      fer_joint6: { p: 500., d: 20., i: 0., i_clamp: 1.,ff_velocity_scale: 1.0  }
      fer_joint7: { p: 200., d: 10., i: 0., i_clamp: 1.,ff_velocity_scale: 1.0  }
